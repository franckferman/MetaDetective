name: Docker

on:
  workflow_run:
    workflows: ["python-publish"]
    types: [completed]
  workflow_dispatch:

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: meta
        run: |
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "[+] Version: ${VERSION}"

      - name: Wait for PyPI index propagation
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          echo "[*] Waiting for MetaDetective==${VERSION} on PyPI..."
          for i in $(seq 1 12); do
            if pip index versions MetaDetective 2>/dev/null | grep -q "${VERSION}"; then
              echo "[+] Found on PyPI after ${i}0 seconds"
              break
            fi
            echo "    Attempt $i/12 - not yet available, waiting 10s..."
            sleep 10
          done

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            franckferman/metadetective:latest
            franckferman/metadetective:${{ steps.meta.outputs.version }}
