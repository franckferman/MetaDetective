name: unittest

on:
  push:
    branches: ["stable"]
    paths:
      - 'tests/test_MetaDetective.py'
      - 'src/MetaDetective/MetaDetective.py'
  pull_request:
    branches: ["stable"]
    paths:
      - 'tests/test_MetaDetective.py'
      - 'src/MetaDetective/MetaDetective.py'

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: python -m unittest discover tests -p '*test*.py'
